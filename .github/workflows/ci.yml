name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Building writes the components' typings (*.d.zb.ts) and the packages the server imports,
      # so typecheck after it.
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      # The same Zubra components in six frameworks, checked in the runner's own Chrome.
      - run: npm run build -w @cardroom/conformance
      - run: npm run conformance -w @cardroom/conformance
      # Tests run through vitest, which forgives some Node ESM import mistakes; boot the real build.
      - name: Smoke test the built server
        run: |
          PORT=8790 CARDROOM_DB=:memory: node packages/server/dist/index.js &
          for i in $(seq 1 20); do curl -fs localhost:8790/healthz && break; sleep 0.5; done
          curl -fs localhost:8790/push/key
          curl -fs localhost:8790/ | grep -q manifest.webmanifest
          # The designer and the admin app are served under the card room's address.
          curl -fs localhost:8790/designer/ | grep -q "Card designer"
          curl -fs localhost:8790/admin/ | grep -q "Card Room admin"
          curl -fs localhost:8790/watch/ | grep -q "Watch a game"
          curl -fs localhost:8790/catalogue | grep -q '"spades"'
          curl -fs localhost:8790/spectate | grep -q '"tables"'
          curl -fs localhost:8790/designs | grep -q '"designs"'
          # Without CARDROOM_ADMIN_TOKEN, moderation is off.
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8790/moderation/overview)" = 503
