name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Building writes the components' typings (*.d.zb.ts), so typecheck after it.
      - run: npm run build -w @spades/web
      - run: npm run typecheck
      - run: npm test
